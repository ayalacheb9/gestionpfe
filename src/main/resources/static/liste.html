<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des rapports</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 0; }

        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar span { font-weight: bold; font-size: 18px; }
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-logout:hover { background-color: #c0392b; }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { color: #2c3e50; font-size: 22px; margin: 0; }

        .btn-primary {
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-primary:hover { background-color: #2980b9; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th { background-color: #f8f9fa; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        tr:hover { background-color: #fbfbfb; }

        .badge {
            background-color: #e8f4fd;
            color: #3498db;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .action-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
            color: white;
        }
        .btn-edit { background-color: #f39c12; }
        .btn-edit:hover { background-color: #e67e22; }
        .btn-delete { background-color: #e74c3c; }
        .btn-delete:hover { background-color: #c0392b; }

        .empty-message { text-align: center; color: #7f8c8d; padding: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <span>Gestion des PFE</span>
        <button class="btn-logout" data-testid="logout-button" onclick="deconnecter()">Déconnexion</button>
    </div>

    <div class="container">
        <div class="header-actions">
            <h1>Liste des rapports</h1>
            <a href="/creer.html" class="btn-primary" data-testid="btn-retour">+ Créer un nouveau rapport</a>
        </div>

        <table data-testid="rapports-table">
            <thead>
                <tr>
                    <th>Identifiant</th>
                    <th>Titre</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="corps"></tbody>
        </table>
    </div>

    <script>
        if (sessionStorage.getItem('connecte') !== 'oui') { location.href = '/login.html'; }

        var STYLES = {
            'Soumis':   { fond: '#e8f4fd', texte: '#3498db' },
            'En cours': { fond: '#fef9e7', texte: '#f39c12' },
            'Validé':   { fond: '#eafaf1', texte: '#27ae60' }
        };
        var SUIVANT = { 'Soumis': 'En cours', 'En cours': 'Validé', 'Validé': 'Soumis' };

        function appliquerStyle(badge) {
            var s = STYLES[badge.textContent] || STYLES['Soumis'];
            badge.style.backgroundColor = s.fond;
            badge.style.color = s.texte;
        }

        // Session expirée ou absente : retour à la connexion
        function sessionValide(reponse) {
            if (reponse.status === 401) {
                sessionStorage.removeItem('connecte');
                location.href = '/login.html';
                return false;
            }
            return true;
        }

        function cellule(texte) {
            var td = document.createElement('td');
            td.textContent = texte;   // textContent : aucun code HTML n'est interprété
            return td;
        }

        function creerLigne(r) {
            var tr = document.createElement('tr');
            tr.setAttribute('data-testid', 'ligne-' + r.identifiant);
            tr.setAttribute('id', 'row-' + r.identifiant);

            var tdStatut = document.createElement('td');
            var badge = document.createElement('span');
            badge.className = 'badge';
            badge.setAttribute('id', 'badge-' + r.identifiant);
            badge.textContent = r.statut;
            appliquerStyle(badge);
            tdStatut.appendChild(badge);

            var tdActions = document.createElement('td');
            var btnEdit = document.createElement('button');
            btnEdit.className = 'action-btn btn-edit';
            btnEdit.setAttribute('data-testid', 'btn-edit-' + r.identifiant);
            btnEdit.textContent = 'Modifier';
            btnEdit.addEventListener('click', function () { modifier(r.identifiant); });

            var btnDelete = document.createElement('button');
            btnDelete.className = 'action-btn btn-delete';
            btnDelete.setAttribute('data-testid', 'btn-delete-' + r.identifiant);
            btnDelete.textContent = 'Supprimer';
            btnDelete.addEventListener('click', function () { supprimer(r.identifiant); });

            tdActions.appendChild(btnEdit);
            tdActions.appendChild(btnDelete);

            tr.appendChild(cellule(r.identifiant));
            tr.appendChild(cellule(r.titre));
            tr.appendChild(tdStatut);
            tr.appendChild(tdActions);
            return tr;
        }

        fetch('/api/rapports').then(function (r) {
            if (!sessionValide(r)) { return null; }
            return r.json();
        }).then(function (liste) {
            if (!liste) { return; }
            var corps = document.getElementById('corps');

            if (liste.length === 0) {
                var vide = document.createElement('tr');
                var td = document.createElement('td');
                td.setAttribute('colspan', '4');
                td.className = 'empty-message';
                td.textContent = 'Aucun rapport pour le moment.';
                vide.appendChild(td);
                corps.appendChild(vide);
                return;
            }
            liste.forEach(function (r) { corps.appendChild(creerLigne(r)); });
        });

        // Modifier le statut : enregistré par le serveur
        function modifier(id) {
            var badge = document.getElementById('badge-' + id);
            var suivant = SUIVANT[badge.textContent] || 'Soumis';
            fetch('/api/rapports/' + encodeURIComponent(id) + '/statut', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ statut: suivant })
            }).then(function (r) {
                if (!sessionValide(r)) { return null; }
                return r.ok ? r.json() : null;
            }).then(function (dto) {
                if (dto) {
                    badge.textContent = dto.statut;
                    appliquerStyle(badge);
                }
            });
        }

        // Supprimer un rapport : enregistré par le serveur
        function supprimer(id) {
            if (confirm("Voulez-vous vraiment supprimer le rapport " + id + " ?")) {
                fetch('/api/rapports/' + encodeURIComponent(id), { method: 'DELETE' }).then(function (r) {
                    if (!sessionValide(r)) { return; }
                    if (r.ok) {
                        var row = document.getElementById('row-' + id);
                        if (row) { row.remove(); }
                    }
                });
            }
        }

        function deconnecter() {
            sessionStorage.removeItem('connecte');
            fetch('/api/auth/logout', { method: 'POST' }).finally(function () {
                location.href = '/login.html';
            });
        }
    </script>
</body>
</html>
