<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des rapports</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 0; }

        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar span { font-weight: bold; font-size: 18px; }
        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-logout:hover { background-color: #c0392b; }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 { color: #2c3e50; font-size: 22px; margin: 0; }

        .btn-primary {
            background-color: #3498db;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-primary:hover { background-color: #2980b9; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th { background-color: #f8f9fa; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        tr:hover { background-color: #fbfbfb; }

        .badge {
            background-color: #e8f4fd;
            color: #3498db;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Boutons d'action dans le tableau */
        .action-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
            color: white;
        }
        .btn-edit { background-color: #f39c12; }
        .btn-edit:hover { background-color: #e67e22; }
        .btn-delete { background-color: #e74c3c; }
        .btn-delete:hover { background-color: #c0392b; }

        .empty-message { text-align: center; color: #7f8c8d; padding: 20px; }
    </style>
</head>
<body>
    <div class="navbar">
        <span>Gestion des PFE</span>
        <button class="btn-logout" data-testid="logout-button" onclick="deconnecter()">Déconnexion</button>
    </div>

    <div class="container">
        <div class="header-actions">
            <h1>Liste des rapports</h1>
            <a href="/creer.html" class="btn-primary" data-testid="btn-retour">+ Créer un nouveau rapport</a>
        </div>

        <table data-testid="rapports-table">
            <thead>
                <tr>
                    <th>Identifiant</th>
                    <th>Titre</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="corps"></tbody>
        </table>
    </div>

    <script>
        if (sessionStorage.getItem('connecte') !== 'oui') { location.href = '/login.html'; }

        fetch('/api/rapports').then(function (r) {
            // Session expirée ou absente : retour à la connexion
            if (r.status === 401) {
                sessionStorage.removeItem('connecte');
                location.href = '/login.html';
                return null;
            }
            return r.json();
        }).then(function (liste) {
            if (!liste) { return; }
            var corps = document.getElementById('corps');

            if (liste.length === 0) {
                corps.innerHTML = '<tr><td colspan="4" class="empty-message">Aucun rapport pour le moment.</td></tr>';
                return;
            }

            liste.forEach(function (r) {
                var tr = document.createElement('tr');
                tr.setAttribute('data-testid', 'ligne-' + r.identifiant);
                tr.setAttribute('id', 'row-' + r.identifiant);

                tr.innerHTML =
                    '<td>' + r.identifiant + '</td>' +
                    '<td>' + r.titre + '</td>' +
                    '<td><span class="badge" id="badge-' + r.identifiant + '">' + r.statut + '</span></td>' +
                    '<td>' +
                        '<button class="action-btn btn-edit" onclick="modifier(\'' + r.identifiant + '\')" data-testid="btn-edit-' + r.identifiant + '">Modifier</button>' +
                        '<button class="action-btn btn-delete" onclick="supprimer(\'' + r.identifiant + '\')" data-testid="btn-delete-' + r.identifiant + '">Supprimer</button>' +
                    '</td>';

                corps.appendChild(tr);
            });
        });

        // Modifier le statut (affichage uniquement)
        function modifier(id) {
            var badge = document.getElementById('badge-' + id);
            if (badge.textContent === 'Soumis') {
                badge.textContent = 'En cours';
                badge.style.backgroundColor = '#fef9e7';
                badge.style.color = '#f39c12';
            } else if (badge.textContent === 'En cours') {
                badge.textContent = 'Validé';
                badge.style.backgroundColor = '#eafaf1';
                badge.style.color = '#27ae60';
            } else {
                badge.textContent = 'Soumis';
                badge.style.backgroundColor = '#e8f4fd';
                badge.style.color = '#3498db';
            }
        }

        // Supprimer une ligne (affichage uniquement)
        function supprimer(id) {
            if (confirm("Voulez-vous vraiment supprimer le rapport " + id + " ?")) {
                var row = document.getElementById('row-' + id);
                row.remove();
            }
        }

        function deconnecter() {
            sessionStorage.removeItem('connecte');
            fetch('/api/auth/logout', { method: 'POST' }).finally(function () {
                location.href = '/login.html';
            });
        }
    </script>
</body>
</html>
