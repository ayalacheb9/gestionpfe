name: Docker Publish and Security
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker build -t ghcr.io/ayalacheb9/gestionpfe:${{ github.sha }} \
                       -t ghcr.io/ayalacheb9/gestionpfe:latest .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8080:8080 ghcr.io/ayalacheb9/gestionpfe:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/actuator/health && echo " OK" && exit 0
            sleep 3
          done
          docker logs app
          exit 1
      - name: Push image
        run: |
          docker push ghcr.io/ayalacheb9/gestionpfe:${{ github.sha }}
          docker push ghcr.io/ayalacheb9/gestionpfe:latest